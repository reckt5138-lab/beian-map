<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>北京备案项目地图 · 2026-11-20</title>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f172a;
    --panel:#ffffff;
    --ink:#0f172a;
    --ink-2:#475569;
    --ink-3:#7c8aa0;
    --line:#e6ebf2;
    --brand:#1d4ed8;
    --brand-soft:#eef3ff;
    --ok:#0f9d58;
    --warn:#f59e0b;
    --danger:#e11d48;
    --expired:#94a3b8;
    --shadow:0 18px 40px rgba(15,23,42,.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:#eef2f7;overflow:hidden;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    height:64px;display:flex;align-items:center;gap:18px;
    padding:0 20px;background:rgba(15,23,42,.96);color:#fff;
    position:relative;z-index:600;backdrop-filter:blur(8px);flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,.18);}
  .brand h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px;}
  .brand small{display:block;font-size:11px;color:#94a3b8;font-weight:400;margin-top:2px;letter-spacing:.4px;}
  .stats{display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden;}
  .stat{
    display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:9px;
    background:rgba(255,255,255,.08);font-size:12px;color:#cbd5e1;white-space:nowrap;
  }
  .stat b{font-size:16px;color:#fff;font-weight:600;}
  .stat.danger b{color:#fb7185;}
  .stat.warn b{color:#fbbf24;}
  .topbar .hint{margin-left:auto;font-size:11.5px;color:#8ea0b6;white-space:nowrap;}

  .stage{flex:1;min-height:0;display:flex;position:relative;}
  #map{flex:1;height:100%;background:#e8edf3;}
  .leaflet-container{font-family:inherit;background:#e8edf3;}

  aside{
    width:392px;height:100%;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;position:relative;z-index:500;box-shadow:-8px 0 24px rgba(15,23,42,.05);
  }
  .p-head{padding:16px 16px 10px;border-bottom:1px solid var(--line);}
  .search{
    display:flex;align-items:center;gap:8px;background:#f4f7fc;border:1px solid #e2e9f4;
    border-radius:10px;padding:9px 12px;
  }
  .search svg{width:15px;height:15px;fill:#93a4b8;flex-shrink:0;}
  .search input{
    border:0;background:transparent;outline:none;flex:1;font-size:13px;color:var(--ink);
    font-family:inherit;
  }
  .search input::placeholder{color:#a7b4c6;}
  .chips{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;}
  .chip{
    border:1px solid #e2e9f4;background:#fff;color:var(--ink-2);font-size:12px;
    padding:6px 11px;border-radius:999px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .chip:hover{border-color:#c9d8f2;color:var(--brand);}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500;}
  .chip .n{opacity:.7;margin-left:3px;font-size:11px;}

  .list{flex:1;overflow-y:auto;padding:10px 10px 20px;}
  .list::-webkit-scrollbar{width:8px;}
  .list::-webkit-scrollbar-thumb{background:#dbe3ee;border-radius:8px;}
  .row{
    padding:11px 12px;border-radius:11px;cursor:pointer;border:1px solid transparent;
    transition:background .15s,border-color .15s;margin-bottom:2px;
  }
  .row:hover{background:#f6f9fe;border-color:#e6eefb;}
  .row.on{background:var(--brand-soft);border-color:#cddcfb;}
  .row-top{display:flex;gap:8px;align-items:flex-start;}
  .idx{
    width:19px;height:19px;border-radius:6px;background:#eef2f8;color:#64748b;font-size:11px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-weight:600;
  }
  .row.on .idx{background:#dbe8ff;color:var(--brand);}
  .row-name{font-size:13px;line-height:1.45;color:var(--ink);font-weight:500;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .row-meta{font-size:11.5px;color:var(--ink-3);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .pill{
    font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;white-space:nowrap;
  }
  .p-ok{background:#e8f7ef;color:#0b7a46;}
  .p-warn{background:#fff4e2;color:#b26b09;}
  .p-danger{background:#ffe9ee;color:#be123c;}
  .p-exp{background:#eff2f7;color:#7b8798;}
  .tag-out{background:#f1f3f7;color:#8892a3;font-size:10.5px;padding:2px 6px;border-radius:5px;}

  /* ====== 悬停提示 ====== */
  .leaflet-tooltip.proj-tip{
    background:#0f172a;border:0;border-radius:12px;padding:0;color:#fff;
    box-shadow:0 16px 34px rgba(2,8,23,.34);width:290px;min-width:290px;max-width:290px;
    white-space:normal;box-sizing:border-box;
  }
  .leaflet-tooltip.proj-tip:before{border-top-color:#0f172a;}
  .leaflet-tooltip-right.proj-tip:before{border-right-color:#0f172a;}
  .leaflet-tooltip-left.proj-tip:before{border-left-color:#0f172a;}
  .leaflet-tooltip-bottom.proj-tip:before{border-bottom-color:#0f172a;}
  .tip{padding:12px 14px;}
  .tip h4{margin:0 0 9px;font-size:13px;line-height:1.5;font-weight:600;color:#fff;}
  .tip .l{display:flex;gap:7px;font-size:11.8px;line-height:1.6;color:#b7c3d6;margin-top:4px;}
  .tip .l span:first-child{color:#7f8fa6;flex-shrink:0;}
  .tip .l b{color:#fff;font-weight:500;}
  .tip .alert{
    margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:space-between;
  }
  .tip .alert .t{font-size:11.5px;color:#93a3ba;}
  .tip-tip{font-size:11px;color:#7e8fa6;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);}
  .leaflet-popup.proj-card{margin-bottom:6px;}
  .leaflet-popup.proj-card .leaflet-popup-content-wrapper{
    background:#0f172a;border-radius:13px;padding:0;color:#fff;
    box-shadow:0 18px 40px rgba(2,8,23,.42);
  }
  .leaflet-popup.proj-card .leaflet-popup-content{margin:0;width:290px !important;}
  .leaflet-popup.proj-card .leaflet-popup-tip{background:#0f172a;box-shadow:none;}
  .leaflet-popup.proj-card .leaflet-popup-close-button{display:none;}
  .tip-menu{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);}
  .tip-go{
    padding:9px 10px;border-radius:8px;cursor:pointer;
    background:rgba(255,255,255,.09);color:#dbe7ff;
    display:flex;align-items:center;gap:8px;
    font-size:12px;font-weight:600;letter-spacing:.3px;transition:.15s;
  }
  .tip-go:hover{background:rgba(96,165,250,.26);color:#fff;}
  .tip-go svg{width:14px;height:14px;fill:#9fc0ff;flex-shrink:0;}
  .tip-go .arrow{margin-left:auto;font-size:15px;line-height:1;opacity:.8;font-weight:400;}
  .tip .big{font-size:15px;font-weight:700;}
  .c-ok{color:#4ade80;} .c-warn{color:#fbbf24;} .c-danger{color:#fb7185;} .c-exp{color:#94a3b8;}

  /* ====== 详情抽屉 ====== */
  .drawer{
    position:absolute;top:0;right:0;width:392px;height:100%;background:var(--panel);
    z-index:520;transform:translateX(102%);transition:transform .32s cubic-bezier(.4,.0,.2,1);
    box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line);
  }
  .drawer.open{transform:translateX(0);}
  .d-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;}
  .back{
    width:30px;height:30px;border-radius:8px;border:1px solid #e2e9f4;background:#fff;
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .back:hover{background:#f6f9fe;border-color:#c9d8f2;}
  .back svg{width:14px;height:14px;fill:#64748b;}
  .d-title{font-size:14px;font-weight:600;line-height:1.5;flex:1;color:var(--ink);}
  .d-body{flex:1;overflow-y:auto;padding:14px 16px 28px;}
  .d-body::-webkit-scrollbar{width:8px;}
  .d-body::-webkit-scrollbar-thumb{background:#dbe3ee;border-radius:8px;}

  .count{
    border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,#f7faff,#eef4ff);
    border:1px solid #e2ecfd;
  }
  .count .k{font-size:11.5px;color:#7183a0;letter-spacing:.5px;}
  .count .v{display:flex;align-items:baseline;gap:8px;margin-top:4px;}
  .count .v b{font-size:34px;font-weight:700;line-height:1;letter-spacing:-1px;}
  .count .v i{font-style:normal;font-size:13px;color:var(--ink-2);}
  .count .bar{height:6px;border-radius:6px;background:#dfe8f6;margin-top:12px;overflow:hidden;}
  .count .bar > span{display:block;height:100%;border-radius:6px;transition:width .5s;}
  .count .tk{display:flex;justify-content:space-between;font-size:11px;color:#8496b0;margin-top:7px;}

  .acts{margin-top:12px;}
  .act{
    display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;
    border-radius:11px;font-size:13px;font-weight:600;color:#fff;text-decoration:none;
    background:linear-gradient(135deg,#16a2e0,#0b74e5);
    box-shadow:0 6px 16px rgba(11,116,229,.26);transition:.18s;
  }
  .act:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 9px 20px rgba(11,116,229,.32);}
  .act svg{width:15px;height:15px;fill:#fff;opacity:.95;flex-shrink:0;}
  .act-note{font-size:11px;color:#98a5b8;margin-top:7px;text-align:center;line-height:1.5;}

  .sec{margin-top:20px;}
  .sec h5{
    font-size:11.5px;color:#8496b0;font-weight:600;letter-spacing:1px;margin:0 0 10px;
    text-transform:uppercase;
  }
  .kv{display:grid;grid-template-columns:88px 1fr;gap:9px 12px;font-size:12.5px;line-height:1.55;}
  .kv .k{color:#8496b0;}
  .kv .v{color:var(--ink);word-break:break-word;}
  .dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .dcell{
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcfe;
  }
  .dcell .k{font-size:11px;color:#8496b0;}
  .dcell .v{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:3px;letter-spacing:.3px;}
  .dcell.hot{border-color:#fbd2dd;background:#fff7f9;}
  .dcell.hot .v{color:#be123c;}

  .timeline{position:relative;padding-left:16px;}
  .timeline:before{content:"";position:absolute;left:3px;top:5px;bottom:5px;width:2px;background:#e8eef8;}
  .tl{position:relative;padding:0 0 13px 0;}
  .tl:before{
    content:"";position:absolute;left:-16px;top:3px;width:8px;height:8px;border-radius:50%;
    background:#c9d7ee;border:2px solid #fff;
  }
  .tl:first-child:before{background:var(--brand);box-shadow:0 0 0 3px #e4ecfd;}
  .tl .d{font-size:11.5px;color:var(--brand);font-weight:600;}
  .tl .t{font-size:12.3px;color:var(--ink-2);line-height:1.55;margin-top:2px;}
  .empty{font-size:12.5px;color:#9aa7ba;padding:8px 0;}

  .legend{
    position:absolute;left:16px;bottom:16px;z-index:400;background:rgba(255,255,255,.95);
    border:1px solid var(--line);border-radius:11px;padding:10px 13px;box-shadow:0 6px 18px rgba(15,23,42,.08);
    font-size:11.5px;color:var(--ink-2);line-height:1.9;
  }
  .legend .t{font-weight:600;color:var(--ink);font-size:11.5px;margin-bottom:3px;}
  .legend .item{display:flex;align-items:center;gap:7px;}
  .legend .s{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .legend .note{color:#9aa7ba;font-size:10.5px;margin-top:5px;max-width:230px;line-height:1.5;}

  .marker-wrap{background:transparent;}
  .ro-badge{
    display:inline-block;margin-left:8px;padding:2px 7px;border-radius:6px;font-size:10.5px;
    color:#9fb0c6;border:1px solid rgba(255,255,255,.22);letter-spacing:.5px;vertical-align:middle;
  }
  details.all{margin-top:4px;}
  details.all summary{cursor:pointer;font-size:12px;color:#7183a0;padding:7px 0;list-style:none;}
  details.all summary::-webkit-details-marker{display:none;}
  details.all summary b{color:var(--brand);font-weight:600;}
  details.all .kv{margin-top:8px;grid-template-columns:118px 1fr;font-size:12px;gap:7px 12px;}
  .pin{
    width:68px;height:68px;border-radius:50%;border:4px solid #fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.55),0 10px 24px rgba(15,23,42,.45);
    display:flex;align-items:center;justify-content:center;
    font-size:25px;font-weight:800;color:#fff;transition:transform .18s;
    letter-spacing:-.5px;text-shadow:0 2px 4px rgba(0,0,0,.3);
  }
  .pin:hover{transform:scale(1.06);}
  .pin.sel{
    transform:scale(1.08);
    box-shadow:0 0 0 5px rgba(255,255,255,.75),0 0 0 12px rgba(29,78,216,.28),0 10px 24px rgba(15,23,42,.45);
  }

  /* ================= 手机端 ================= */
  .fab{display:none;}
  @media (max-width:820px){
    body{overflow:hidden;}
    .topbar{height:auto;min-height:58px;padding:9px 12px;gap:8px;flex-wrap:wrap;align-items:flex-start;}
    .brand h1{font-size:15.5px;}
    .brand small{font-size:10.5px;}
    .topbar .hint{display:none;}
    .stats{
      order:3;width:100%;margin-top:2px;gap:6px;overflow-x:auto;scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
    }
    .stats::-webkit-scrollbar{display:none;}
    .stat{padding:5px 9px;font-size:11px;border-radius:8px;flex-shrink:0;}
    .stat b{font-size:13.5px;}


    aside{
      width:100%;height:82%;max-height:82%;position:absolute;left:0;right:0;bottom:0;top:auto;
      border-left:0;border-radius:18px 18px 0 0;transform:translateY(101%);
      transition:transform .3s cubic-bezier(.4,0,.2,1);
      box-shadow:0 -12px 34px rgba(15,23,42,.22);padding-bottom:env(safe-area-inset-bottom);
      overscroll-behavior:contain;z-index:560;
    }
    aside.open{transform:translateY(0);}
    .p-head{padding:20px 14px 10px;}
    .search{padding:11px 13px;border-radius:12px;}
    .search input{font-size:15px;}
    .chip{padding:8px 14px;font-size:13px;}
    .list{padding:8px 8px 24px;}
    .row{padding:13px 12px;}
    .row-name{font-size:14px;-webkit-line-clamp:3;}
    .row-meta{font-size:12px;}

    .drawer{
      width:100%;height:90%;max-height:90%;top:auto;bottom:0;left:0;
      border-left:0;border-radius:18px 18px 0 0;transform:translateY(101%);
      padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:contain;
    }
    .drawer.open{transform:translateY(0);}
    .d-head{padding:24px 14px 12px;}
    .d-title{font-size:14.5px;}
    .back{width:34px;height:34px;border-radius:10px;}
    .d-body{padding:14px 14px 30px;}
    .kv{grid-template-columns:78px 1fr;font-size:13px;}
    .act{padding:13px 14px;font-size:14px;border-radius:12px;}
    .act svg{width:17px;height:17px;}
    .count .v b{font-size:38px;}
    .dates{gap:9px;}
    .dcell{padding:11px 12px;}
    .dcell .v{font-size:14.5px;}

    .leaflet-tooltip.proj-tip{width:min(290px,76vw);min-width:0;max-width:76vw;}

    .fab{
      display:flex;align-items:center;gap:6px;position:absolute;right:12px;bottom:calc(46px + env(safe-area-inset-bottom));
      z-index:555;padding:12px 15px;border-radius:999px;border:0;cursor:pointer;
      background:#0f172a;color:#fff;font-size:13.5px;font-weight:600;font-family:inherit;
      box-shadow:0 10px 26px rgba(15,23,42,.34);transition:opacity .2s;
    }
    .fab svg{width:16px;height:16px;fill:#fff;opacity:.9;}
    .fab .fab-n{background:rgba(255,255,255,.18);border-radius:999px;font-size:11.5px;padding:1px 7px;}
    .legend{
      display:flex;align-items:center;gap:9px;top:auto;bottom:12px;left:10px;right:auto;padding:6px 9px;
      border-radius:9px;font-size:10.5px;line-height:1.2;opacity:.96;box-shadow:0 3px 10px rgba(15,23,42,.1);
    }
    .legend .note{display:none;}
    .legend .t{display:none;}
    .legend .item{gap:4px;white-space:nowrap;font-size:10.5px;}
    .legend .s{width:8px;height:8px;border-width:1px;}

    aside:before,.drawer:before{
      content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
      width:40px;height:4px;border-radius:4px;background:#d8e2ef;z-index:3;
    }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>北京备案项目地图<span class="ro-badge">只读</span></h1>
      <small id="srcLine">正在读取飞书在线表格…</small>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <a class="hint" id="sheetLink" href="https://jcntthw4tzwh.feishu.cn/sheets/E1AcsZQ2EhT6Vgt9GiHcxmp6ncc" target="_blank" rel="noopener" style="text-decoration:none">飞书原表 ↗</a>
  <div class="hint" id="hintBtn" style="cursor:pointer;margin-left:14px">数据来源：飞书表格 · 点此刷新</div>
</header>

<div class="stage">
  <div id="map"></div>

  <aside id="sidebar">
    <div class="p-head">
      <div class="search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="q" type="text" placeholder="搜索项目名称 / 地址 / 客户 / 业务员" />
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div class="drawer" id="drawer">
    <div class="d-head">
      <button class="back" id="closeBtn" title="返回列表">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 6.17 4 14l8 8 1.42-1.42L7.83 13H20z"/></svg>
      </button>
      <div class="d-title" id="dTitle"></div>
    </div>
    <div class="d-body" id="dBody"></div>
  </div>

  <div class="legend">
    <div class="t">失效紧急度</div>
    <div class="item"><span class="s" style="background:#e11d48"></span>7 天内失效</div>
    <div class="item"><span class="s" style="background:#f59e0b"></span>8–14 天</div>
    <div class="item"><span class="s" style="background:#0f9d58"></span>15 天以上</div>
    <div class="item"><span class="s" style="background:#94a3b8"></span>已失效</div>
    <div class="note">圆内数字为距离失效的天数；圆点坐标为按项目地址生成的近似位置。</div>
  </div>

  <button class="fab" id="fab">
    <svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"/></svg>
    项目列表<span class="fab-n" id="fabN">0</span>
  </button>
</div>

<script src="https://fastly.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================= 数据源 ================= */
/* 渲染/地图/交互全部在浏览器里跑，不依赖后端。数据按下面顺序逐个尝试，
   前一个失败就自动换下一个：联网时拿云端最新，断网时还有内置快照。

     1) ?data=https://...          手动指定的地址

/* ================= 基础工具 ================= */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const DAY = 86400000;
function parseDate(s){ if(!s) return null; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? null : d; }
function daysLeft(p){ const d = parseDate(p.expire); if(!d) return null; return Math.round((d - TODAY) / DAY); }
function level(p){
  const n = daysLeft(p);
  if(n === null) return 'none';
  if(n < 0) return 'expired';
  if(n <= 7) return 'danger';
  if(n <= 14) return 'warn';
  return 'ok';
}
const COLOR = {danger:'#e11d48', warn:'#f59e0b', ok:'#0f9d58', expired:'#94a3b8', none:'#94a3b8'};
const LEVEL_TEXT = {danger:'7 天内', warn:'8–14 天', ok:'15 天以上', expired:'已失效', none:'无失效日期'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inBeijing(p){ return p.lat && p.lng && p.lat > 39.3 && p.lat < 41.2 && p.lng > 115.2 && p.lng < 117.6; }
function leftText(n){ if(n===null) return '—'; return n < 0 ? '已失效 ' + Math.abs(n) + ' 天' : n + ' 天'; }

/* WGS84 → GCJ-02：坐标按高德底图纠偏，避免整体偏移 */
const PI = Math.PI, AXIS = 6378245.0, ECC = 0.00669342162296594323;
function outOfChina(lat, lng){ return !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55); }
function tLat(x, y){
  let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  r += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI)) * 2/3;
  r += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30)) * 2/3;
  return r;
}
function tLng(x, y){
  let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
  r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3;
  return r;
}
function wgs2gcj(lat, lng){
  if(outOfChina(lat, lng)) return [lat, lng];
  let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
  const radLat = lat / 180 * PI;
  let magic = Math.sin(radLat); magic = 1 - ECC * magic * magic;
  const sq = Math.sqrt(magic);
  dLat = (dLat * 180) / ((AXIS * (1 - ECC)) / (magic * sq) * PI);
  dLng = (dLng * 180) / (AXIS / sq * Math.cos(radLat) * PI);
  return [lat + dLat, lng + dLng];
}
function applyGeo(list){
  list.forEach(p => {
    if(!inBeijing(p)) return;
    const g = wgs2gcj(p.lat, p.lng);
    p.glat = g[0]; p.glng = g[1];
  });
  /* 坐标相近的项目做少量错位，避免圆点叠在一起看不清 */
  const placed = [];
  list.filter(inBeijing).forEach(p => {
    p.mlat = p.glat; p.mlng = p.glng;
    for(let i = 0; i < 24; i++){
      const clash = placed.some(q => Math.abs(q.lat - p.mlat) < 0.0245 && Math.abs(q.lng - p.mlng) < 0.0275);
      if(!clash) break;
      const ang = (i * 137.5) * PI / 180;
      p.mlat = p.glat + 0.0105 * Math.sin(ang) * (1 + Math.floor(i / 4));
      p.mlng = p.glng + 0.0115 * Math.cos(ang) * (1 + Math.floor(i / 4));
    }
    placed.push({lat: p.mlat, lng: p.mlng});
  });
}

  return L.divIcon({
    className: 'marker-wrap',
    html: '<div class="pin" id="pin-'+p._id+'" style="background:'+c+';width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*0.37)+'px">'+(n!==null && n>=0 ? n : '×')+'</div>',
    iconSize: [s, s], iconAnchor: [s/2, s/2]
  });
}

function buildMarkers(){
  Object.keys(markers).forEach(k => { map.removeLayer(markers[k]); delete markers[k]; });
  PROJECTS.filter(inBeijing).forEach(p => {
    const m = L.marker([p.mlat, p.mlng], {icon: markerIcon(p), riseOnHover:true, title:p.name}).addTo(map);
    m.bindTooltip(tipHTML(p, false), {className:'proj-tip', direction:'auto', offset:[pinSize()/2+4,0], opacity:1, sticky:false});
    m.bindPopup(tipHTML(p, true), {
      className:'proj-card', maxWidth:320, minWidth:290, offset:[0,-Math.round(pinSize()/2)],
      closeButton:false, autoPan:true, autoPanPadding:[16,16], closeOnClick:true

    m.on('click', (e) => {
      if(e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent);
      m.closeTooltip();
      m.openPopup();
    });

function tipHTML(p, withMenu){

function filtered(){

  return PROJECTS.filter(p => {
    if(state.filter !== 'all' && level(p) !== state.filter) return false;
    if(!q) return true;
    const hay = [p.name,p.addr,p.customer,p.owner,p.product,p.stage,p.desc,p.lastRecord].join(' ').toLowerCase();

    const A = daysLeft(a), B = daysLeft(b);
    if(A===null) return 1; if(B===null) return -1;

  });

function district(addr){

function renderChips(){

  document.getElementById('chips').innerHTML = FILTERS.map(f =>
    '<button class="chip'+(state.filter===f.k?' on':'')+'" data-k="'+f.k+'">'+f.t+'<span class="n">'+counts[f.k]+'</span></button>'

    html += '<div class="sec"><h5>全部字段 · 只读</h5>'
      + '<details class="all"><summary>展开 <b>'+p.fields.length+'</b> 项（飞书表 158 列，只显示非空值）</summary>'
      + '<div class="kv">' + p.fields.map(f =>
          '<div class="k">'+esc(f[0])+'</div><div class="v">'+esc(f[1])+'</div>'
        ).join('') + '</div></details></div>';
  }

  document.getElementById('dBody').innerHTML = html;
  document.getElementById('dBody').scrollTop = 0;
}

/* ================= 交互 ================= */
function select(id, pan){
  state.sel = id;
  const p = PROJECTS[id];
  renderDetail(p);
  if(markers[id]) markers[id].closePopup();
  document.getElementById('drawer').classList.add('open');
  if(isMobile()){
    document.getElementById('sidebar').classList.remove('open');
    const f = document.getElementById('fab');
    f.style.opacity = '0'; f.style.pointerEvents = 'none';
  }
  document.querySelectorAll('.pin').forEach(x => x.classList.remove('sel'));
  const pin = document.getElementById('pin-'+id);
  if(pin) pin.classList.add('sel');
  renderList();
  if(pan && markers[id]){
    const z = isMobile() ? Math.max(map.getZoom(), 13) : Math.max(map.getZoom(), 13);
    map.flyTo([p.mlat, p.mlng], z, {duration:0.6});
    markers[id].openTooltip();
    setTimeout(()=>markers[id].closeTooltip(), 3500);
  }
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  state.sel = null;
  document.querySelectorAll('.pin').forEach(x => x.classList.remove('sel'));
  renderList();
  if(isMobile()){
    const f = document.getElementById('fab');
    f.style.opacity = '1'; f.style.pointerEvents = 'auto';
  }
}
document.getElementById('closeBtn').onclick = closeDrawer;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });
document.getElementById('q').oninput = e => { state.q = e.target.value; renderList(); };

/* 点悬停卡片里的“查看项目明细”，直接进入详情 */
document.addEventListener('click', e => {
  const go = e.target.closest ? e.target.closest('.tip-go') : null;
  if(!go) return;
  e.preventDefault();
  e.stopPropagation();
  const id = +go.dataset.id;
  if(markers[id]) markers[id].closeTooltip();
  select(id, false);
}, true);

document.addEventListener('touchend', e => {
  const go = e.target.closest ? e.target.closest('.tip-go') : null;
  if(!go) return;
  e.preventDefault();
  e.stopPropagation();
  const id = +go.dataset.id;
  if(markers[id]) markers[id].closeTooltip();
  select(id, false);
}, true);

/* 手机端：底部弹出项目列表 */
const fab = document.getElementById('fab');
fab.onclick = () => {
  const side = document.getElementById('sidebar');
  side.classList.toggle('open');
  document.getElementById('fab').style.opacity = side.classList.contains('open') ? '0' : '1';
  document.getElementById('fab').style.pointerEvents = side.classList.contains('open') ? 'none' : 'auto';
};

/* 手机端：点地图空白处收起项目列表 */
map.on('click', (e) => {
  const t = e.originalEvent && e.originalEvent.target;
  if(t && t.closest && t.closest('.marker-wrap')) return;
  Object.keys(markers).forEach(k => markers[k].closeTooltip());
  if(!isMobile()) return;
  const side = document.getElementById('sidebar');
  if(side.classList.contains('open')){
    side.classList.remove('open');
    fab.style.opacity = '1'; fab.style.pointerEvents = 'auto';
  }
});

/* 大比例尺（缩放 13 级以上）回归真实坐标，避免错位影响判读 */
function syncPositions(){
  const spread = map.getZoom() <= 12;
  PROJECTS.filter(inBeijing).forEach(p => {
    const m = markers[p._id];
    if(m) m.setLatLng(spread ? [p.mlat, p.mlng] : [p.glat, p.glng]);
  });
}
map.on('zoomend', syncPositions);

/* 屏幕尺寸变化：同步圆点大小，跨断点时收起浮层 */
let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    PROJECTS.filter(inBeijing).forEach(p => {
      const m = markers[p._id];
      if(m){
        m.setIcon(markerIcon(p));
        m.setTooltipContent(tipHTML(p));
      }
    });
    map.invalidateSize();
    const side = document.getElementById('sidebar');
    const f = document.getElementById('fab');
    if(!isMobile()){
      side.classList.remove('open');
      f.style.opacity = '0'; f.style.pointerEvents = 'none';
    }else{
      f.style.opacity = side.classList.contains('open') ? '0' : '1';
      f.style.pointerEvents = side.classList.contains('open') ? 'none' : 'auto';
    }
  }, 220);
});

/* ================= 数据加载 ================= */
function setStatus(txt, bad){
  const el = document.getElementById('srcLine');
  if(!el) return;
  el.textContent = txt;
  el.style.color = bad ? '#fda4af' : '';
}

async function getJSON(url, ms){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || FETCH_TIMEOUT);
  try{
    const r = await fetch(url, {cache:'no-store', signal: ctl.signal});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  }finally{
    clearTimeout(timer);
  }
}

/* Raw 和 jsDelivr 同时请求，谁先回来用谁（少等一次超时） */
async function firstOk(urls, ms){
  return await Promise.any(urls.map(u => getJSON(u, ms).then(j => ({j, u}))));
}

/* 同时请求所有云端地址，等齐（最多 ms 秒），取数据更新的那份。
   CDN 有缓存，先回来的不一定最新，所以按 updated / generated_at 比一比。 */
async function bestOf(urls, ms){
  const results = await Promise.all(urls.map(async u => {
    try{ return {j: await getJSON(u, ms), u}; }
    catch(e){ return null; }
  }));
  const ok = results.filter(Boolean);
  if(!ok.length) throw new Error('云端地址全部失败');
  const stamp = r => String((r.j && (r.j.updated || r.j.generated_at)) || '');
  ok.sort((a, b) => (stamp(a) < stamp(b) ? 1 : (stamp(a) > stamp(b) ? -1 : 0)));
  return ok[0];
}

function msg(e){
  if(!e) return '未知错误';
  if(e.name === 'AbortError') return '超时';
  if(e.errors) return e.errors.map(x => msg(x)).join(' / ');
  return e.message || String(e);
}

function normalize(payload){
  const arr = Array.isArray(payload) ? payload : (payload.projects || []);
  return arr.map((p, i) => {
    p._id = i;
    p.signCount = Number(p.signCount || (p.signs || []).length || 0);
    if(p.lat === '' || p.lat === null || p.lat === undefined){ p.lat = null; p.lng = null; }
    if(p.lat !== null){ p.lat = Number(p.lat); p.lng = Number(p.lng); }
    if(!p.signs) p.signs = [];
    return p;
  });
}

function accept(j, origin){
  if(j && j.error) throw new Error(j.error);
  const arr = Array.isArray(j) ? j : (j.projects || []);
  if(!arr.length) throw new Error('返回 0 条');
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(j)); }catch(e){}
  return {payload:j, arr, origin};
}

/* 加载顺序：
     1) ?data= 手动指定
     2) 云端 data.json（Raw / jsDelivr 并行竞速）—— 永远是最新
     3) Worker 只读接口 ?api=
     4) 同目录 ./data.json、./projects.json（本地 HTTP 服务 / Pages）
     5) 本机地图服务 127.0.0.1:8787（双击 html 时）
     6) 内置快照 window.EMBEDDED
     7) localStorage 缓存 */
async function loadData(){
  const tried = [];
  const custom = PARAMS.get('data');

  if(custom){
    try{ return accept(await getJSON(custom), custom); }
    catch(e){ tried.push(custom + ' → ' + msg(e)); }
  }else{
    const cu = cloudUrls();
    if(cu.length){
      try{
        const hit = await bestOf(cu, CLOUD_TIMEOUT);
        return accept(hit.j, hit.u);
      }catch(e){
        tried.push('云端 data.json → ' + msg(e));
      }
    }
    if(REMOTE_API){
      const u = REMOTE_API + '/projects.json' + (REMOTE_KEY ? ('?key=' + encodeURIComponent(REMOTE_KEY)) : '');
      try{ return accept(await getJSON(u), u); }
      catch(e){ tried.push(u + ' → ' + msg(e)); }
    }
    const locals = [DATA_URL, './projects.json'];
    if(location.protocol === 'file:') locals.push(FALLBACK_URL);
    for(const u of locals){
      try{ return accept(await getJSON(u), u); }
      catch(e){ tried.push(u + ' → ' + msg(e)); }
    }
  }
  const emb = window.EMBEDDED;
  if(emb){
    const arr = Array.isArray(emb) ? emb : (emb.projects || []);
    if(arr.length) return {payload:emb, arr, origin:'内置快照'};
  }
  try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    const arr = Array.isArray(c) ? c : ((c && c.projects) || []);
    if(arr.length) return {payload:c, arr, origin:'本地缓存'};
  }catch(e){}
  throw new Error(tried.join('；') || '没有可用数据源');
}

async function bootstrap(){
  setStatus('正在读取最新数据…');
  try{
    const { payload, arr, origin } = await loadData();
    PROJECTS = normalize(arr);
    DATA_META = {
      updated: (payload && payload.updated) || '',
      source: (payload && payload.source) || '',
      count: PROJECTS.length,
      origin: origin
    };
    applyGeo(PROJECTS);
    buildMarkers();
    renderStats(); renderChips(); renderList();
    document.getElementById('fabN').textContent = PROJECTS.length;
    document.title = '北京备案项目地图 · ' + (DATA_META.updated ? DATA_META.updated.slice(0, 10) : '飞书同步');
    const src = String(origin);
    let tag = '飞书表格';
    if(origin === '内置快照') tag = '内置快照';
    else if(origin === '本地缓存') tag = '离线缓存';
    else if(/raw\.githubusercontent/.test(src)) tag = '云端最新';
    else if(/jsdelivr/.test(src)) tag = '云端CDN';
    else if(origin === './data.json' || origin === './projects.json') tag = '本地数据';
    else if(REMOTE_API && src.indexOf(REMOTE_API) === 0) tag = '飞书实时';
    const noCloud = !REPO_PARAM && !(CLOUD && CLOUD.owner && CLOUD.repo);
    setStatus(tag + ' ' + (DATA_META.updated ? DATA_META.updated.slice(5, 16) : '')
      + ' · ' + PROJECTS.length + ' 条'
      + (origin === '内置快照' || origin === '本地缓存' ? ' · 未联网或没起服务，用的是快照，点标题可重载'
         : (noCloud ? ' · 未配置云端仓库（?repo=owner/repo 可直连 GitHub）' : '')));
  }catch(e){
    setStatus('数据加载失败：' + e.message + '（点此重试）', true);
    renderStats(); renderChips(); renderList();
  }
  if(!isMobile()){
    const f = document.getElementById('fab');
    f.style.opacity = '0'; f.style.pointerEvents = 'none';
  }
  const autoOpen = PARAMS.get('open');
  if(autoOpen !== null && PROJECTS.length){
    const id = Number(autoOpen);
    if(!isNaN(id) && PROJECTS[id]) select(id, true);
  }
  setTimeout(()=>map.invalidateSize(), 200);
}

document.getElementById('hintBtn').onclick = () => location.reload();
bootstrap();
</script>
