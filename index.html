<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>北京备案项目地图</title>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f172a;
    --panel:#ffffff;
    --ink:#0f172a;
    --ink-2:#475569;
    --ink-3:#7c8aa0;
    --line:#e6ebf2;
    --brand:#1d4ed8;
    --brand-soft:#eef3ff;
    --ok:#0f9d58;
    --warn:#f59e0b;
    --danger:#e11d48;
    --expired:#94a3b8;
    --shadow:0 18px 40px rgba(15,23,42,.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:#eef2f7;overflow:hidden;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    height:64px;display:flex;align-items:center;gap:18px;
    padding:0 20px;background:rgba(15,23,42,.96);color:#fff;
    position:relative;z-index:600;backdrop-filter:blur(8px);flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,.18);}
  .brand h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px;}
  .brand small{display:block;font-size:11px;color:#94a3b8;font-weight:400;margin-top:2px;letter-spacing:.4px;}
  .stats{display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden;}
  .stat{
    display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:9px;
    background:rgba(255,255,255,.08);font-size:12px;color:#cbd5e1;white-space:nowrap;
  }
  .stat b{font-size:16px;color:#fff;font-weight:600;}
  .stat.danger b{color:#fb7185;}
  .stat.warn b{color:#fbbf24;}
  .topbar .hint{margin-left:auto;font-size:11.5px;color:#8ea0b6;white-space:nowrap;}

  .stage{flex:1;min-height:0;display:flex;position:relative;}
  #map{flex:1;height:100%;background:#e8edf3;}
  .leaflet-container{font-family:inherit;background:#e8edf3;}

  aside{
    width:392px;height:100%;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;position:relative;z-index:500;box-shadow:-8px 0 24px rgba(15,23,42,.05);
  }
  .p-head{padding:16px 16px 10px;border-bottom:1px solid var(--line);}
  .search{
    display:flex;align-items:center;gap:8px;background:#f4f7fc;border:1px solid #e2e9f4;
    border-radius:10px;padding:9px 12px;
  }
  .search svg{width:15px;height:15px;fill:#93a4b8;flex-shrink:0;}
  .search input{
    border:0;background:transparent;outline:none;flex:1;font-size:13px;color:var(--ink);
    font-family:inherit;
  }
  .search input::placeholder{color:#a7b4c6;}
  .chips{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;}
  .chip{
    border:1px solid #e2e9f4;background:#fff;color:var(--ink-2);font-size:12px;
    padding:6px 11px;border-radius:999px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .chip:hover{border-color:#c9d8f2;color:var(--brand);}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500;}
  .chip .n{opacity:.7;margin-left:3px;font-size:11px;}

  .list{flex:1;overflow-y:auto;padding:10px 10px 20px;}
  .list::-webkit-scrollbar{width:8px;}
  .list::-webkit-scrollbar-thumb{background:#dbe3ee;border-radius:8px;}
  .row{
    padding:11px 12px;border-radius:11px;cursor:pointer;border:1px solid transparent;
    transition:background .15s,border-color .15s;margin-bottom:2px;
  }
  .row:hover{background:#f6f9fe;border-color:#e6eefb;}
  .row.on{background:var(--brand-soft);border-color:#cddcfb;}
  .row-top{display:flex;gap:8px;align-items:flex-start;}
  .idx{
    width:19px;height:19px;border-radius:6px;background:#eef2f8;color:#64748b;font-size:11px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-weight:600;
  }
  .row.on .idx{background:#dbe8ff;color:var(--brand);}
  .row-name{font-size:13px;line-height:1.45;color:var(--ink);font-weight:500;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .row-meta{font-size:11.5px;color:var(--ink-3);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .pill{
    font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;white-space:nowrap;
  }
  .p-ok{background:#e8f7ef;color:#0b7a46;}
  .p-warn{background:#fff4e2;color:#b26b09;}
  .p-danger{background:#ffe9ee;color:#be123c;}
  .p-exp{background:#eff2f7;color:#7b8798;}
  .tag-out{background:#f1f3f7;color:#8892a3;font-size:10.5px;padding:2px 6px;border-radius:5px;}

  /* ====== 悬停提示 ====== */
  .leaflet-tooltip.proj-tip{
    background:#0f172a;border:0;border-radius:12px;padding:0;color:#fff;
    box-shadow:0 16px 34px rgba(2,8,23,.34);width:290px;min-width:290px;max-width:290px;
    white-space:normal;box-sizing:border-box;
  }
  .leaflet-tooltip.proj-tip:before{border-top-color:#0f172a;}
  .leaflet-tooltip-right.proj-tip:before{border-right-color:#0f172a;}
  .leaflet-tooltip-left.proj-tip:before{border-left-color:#0f172a;}
  .leaflet-tooltip-bottom.proj-tip:before{border-bottom-color:#0f172a;}
  .tip{padding:12px 14px;}
  .tip h4{margin:0 0 9px;font-size:13px;line-height:1.5;font-weight:600;color:#fff;}
  .tip .l{display:flex;gap:7px;font-size:11.8px;line-height:1.6;color:#b7c3d6;margin-top:4px;}
  .tip .l span:first-child{color:#7f8fa6;flex-shrink:0;}
  .tip .l b{color:#fff;font-weight:500;}
  .tip .alert{
    margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:space-between;
  }
  .tip .alert .t{font-size:11.5px;color:#93a3ba;}
  .tip-tip{font-size:11px;color:#7e8fa6;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);}
  .leaflet-popup.proj-card{margin-bottom:6px;}
  .leaflet-popup.proj-card .leaflet-popup-content-wrapper{
    background:#0f172a;border-radius:13px;padding:0;color:#fff;
    box-shadow:0 18px 40px rgba(2,8,23,.42);
  }
  .leaflet-popup.proj-card .leaflet-popup-content{margin:0;width:290px !important;}
  .leaflet-popup.proj-card .leaflet-popup-tip{background:#0f172a;box-shadow:none;}
  .leaflet-popup.proj-card .leaflet-popup-close-button{display:none;}
  .tip-menu{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);}
  .tip-go{
    padding:9px 10px;border-radius:8px;cursor:pointer;
    background:rgba(255,255,255,.09);color:#dbe7ff;
    display:flex;align-items:center;gap:8px;
    font-size:12px;font-weight:600;letter-spacing:.3px;transition:.15s;
  }
  .tip-go:hover{background:rgba(96,165,250,.26);color:#fff;}
  .tip-go svg{width:14px;height:14px;fill:#9fc0ff;flex-shrink:0;}
  .tip-go .arrow{margin-left:auto;font-size:15px;line-height:1;opacity:.8;font-weight:400;}
  .tip .big{font-size:15px;font-weight:700;}
  .c-ok{color:#4ade80;} .c-warn{color:#fbbf24;} .c-danger{color:#fb7185;} .c-exp{color:#94a3b8;}

  /* ====== 详情抽屉 ====== */
  .drawer{
    position:absolute;top:0;right:0;width:392px;height:100%;background:var(--panel);
    z-index:520;transform:translateX(102%);transition:transform .32s cubic-bezier(.4,.0,.2,1);
    box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line);
  }
  .drawer.open{transform:translateX(0);}
  .d-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;}
  .back{
    width:30px;height:30px;border-radius:8px;border:1px solid #e2e9f4;background:#fff;
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .back:hover{background:#f6f9fe;border-color:#c9d8f2;}
  .back svg{width:14px;height:14px;fill:#64748b;}
  .d-title{font-size:14px;font-weight:600;line-height:1.5;flex:1;color:var(--ink);}
  .d-body{flex:1;overflow-y:auto;padding:14px 16px 28px;}
  .d-body::-webkit-scrollbar{width:8px;}
  .d-body::-webkit-scrollbar-thumb{background:#dbe3ee;border-radius:8px;}

  .count{
    border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,#f7faff,#eef4ff);
    border:1px solid #e2ecfd;
  }
  .count .k{font-size:11.5px;color:#7183a0;letter-spacing:.5px;}
  .count .v{display:flex;align-items:baseline;gap:8px;margin-top:4px;}
  .count .v b{font-size:34px;font-weight:700;line-height:1;letter-spacing:-1px;}
  .count .v i{font-style:normal;font-size:13px;color:var(--ink-2);}
  .count .bar{height:6px;border-radius:6px;background:#dfe8f6;margin-top:12px;overflow:hidden;}
  .count .bar > span{display:block;height:100%;border-radius:6px;transition:width .5s;}
  .count .tk{display:flex;justify-content:space-between;font-size:11px;color:#8496b0;margin-top:7px;}

  .acts{margin-top:12px;}
  .act{
    display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;
    border-radius:11px;font-size:13px;font-weight:600;color:#fff;text-decoration:none;
    background:linear-gradient(135deg,#16a2e0,#0b74e5);
    box-shadow:0 6px 16px rgba(11,116,229,.26);transition:.18s;
  }
  .act:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 9px 20px rgba(11,116,229,.32);}
  .act svg{width:15px;height:15px;fill:#fff;opacity:.95;flex-shrink:0;}
  .act-note{font-size:11px;color:#98a5b8;margin-top:7px;text-align:center;line-height:1.5;}

  .sec{margin-top:20px;}
  .sec h5{
    font-size:11.5px;color:#8496b0;font-weight:600;letter-spacing:1px;margin:0 0 10px;
    text-transform:uppercase;
  }
  .kv{display:grid;grid-template-columns:88px 1fr;gap:9px 12px;font-size:12.5px;line-height:1.55;}
  .kv .k{color:#8496b0;}
  .kv .v{color:var(--ink);word-break:break-word;}
  .dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .dcell{
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcfe;
  }
  .dcell .k{font-size:11px;color:#8496b0;}
  .dcell .v{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:3px;letter-spacing:.3px;}
  .dcell.hot{border-color:#fbd2dd;background:#fff7f9;}
  .dcell.hot .v{color:#be123c;}

  .timeline{position:relative;padding-left:16px;}
  .timeline:before{content:"";position:absolute;left:3px;top:5px;bottom:5px;width:2px;background:#e8eef8;}
  .tl{position:relative;padding:0 0 13px 0;}
  .tl:before{
    content:"";position:absolute;left:-16px;top:3px;width:8px;height:8px;border-radius:50%;
    background:#c9d7ee;border:2px solid #fff;
  }
  .tl:first-child:before{background:var(--brand);box-shadow:0 0 0 3px #e4ecfd;}
  .tl .d{font-size:11.5px;color:var(--brand);font-weight:600;}
  .tl .t{font-size:12.3px;color:var(--ink-2);line-height:1.55;margin-top:2px;}
  .empty{font-size:12.5px;color:#9aa7ba;padding:8px 0;}

  .legend{
    position:absolute;left:16px;bottom:16px;z-index:400;background:rgba(255,255,255,.95);
    border:1px solid var(--line);border-radius:11px;padding:10px 13px;box-shadow:0 6px 18px rgba(15,23,42,.08);
    font-size:11.5px;color:var(--ink-2);line-height:1.9;
  }
  .legend .t{font-weight:600;color:var(--ink);font-size:11.5px;margin-bottom:3px;}
  .legend .item{display:flex;align-items:center;gap:7px;}
  .legend .s{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .legend .note{color:#9aa7ba;font-size:10.5px;margin-top:5px;max-width:230px;line-height:1.5;}

  .marker-wrap{background:transparent;}
  .ro-badge{
    display:inline-block;margin-left:8px;padding:2px 7px;border-radius:6px;font-size:10.5px;
    color:#9fb0c6;border:1px solid rgba(255,255,255,.22);letter-spacing:.5px;vertical-align:middle;
  }
  details.all{margin-top:4px;}
  details.all summary{cursor:pointer;font-size:12px;color:#7183a0;padding:7px 0;list-style:none;}
  details.all summary::-webkit-details-marker{display:none;}
  details.all summary b{color:var(--brand);font-weight:600;}
  details.all .kv{margin-top:8px;grid-template-columns:118px 1fr;font-size:12px;gap:7px 12px;}
  .pin{
    width:68px;height:68px;border-radius:50%;border:4px solid #fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.55),0 10px 24px rgba(15,23,42,.45);
    display:flex;align-items:center;justify-content:center;
    font-size:25px;font-weight:800;color:#fff;transition:transform .18s;
    letter-spacing:-.5px;text-shadow:0 2px 4px rgba(0,0,0,.3);
  }
  .pin:hover{transform:scale(1.06);}
  .pin.sel{
    transform:scale(1.08);
    box-shadow:0 0 0 5px rgba(255,255,255,.75),0 0 0 12px rgba(29,78,216,.28),0 10px 24px rgba(15,23,42,.45);
  }

  /* ================= 手机端 ================= */
  .fab{display:none;}
  /* ====== 项目分类导航 ====== */
  .proj-tabs{
    display:flex;align-items:center;gap:8px;padding:9px 16px;flex-shrink:0;
    background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);z-index:590;
  }
  .ptab{
    display:flex;align-items:center;gap:7px;padding:8px 20px;border-radius:10px;cursor:pointer;
    border:1px solid #dbe4f0;background:#fff;color:var(--ink-2);
    font-family:inherit;font-size:13px;font-weight:600;line-height:1.2;transition:.15s;
  }
  .ptab:hover{border-color:#bfd3f5;color:var(--brand);}
  .ptab.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(29,78,216,.18);}
  .ptab .n{font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:999px;background:#f1f5fb;color:var(--ink-3);}
  .ptab.on .n{background:rgba(255,255,255,.2);color:#fff;}
  .ptab-tip{margin-left:auto;font-size:11.5px;color:var(--ink-3);white-space:nowrap;}
  .map-empty{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:520;
    background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;
    padding:14px 20px;font-size:13px;color:var(--ink-2);box-shadow:var(--shadow);text-align:center;
    max-width:78%;line-height:1.6;pointer-events:none;
  }

  /* ====== 合同信息 ====== */
  .contract-loading,.contract-empty,.contract-note{font-size:12.5px;line-height:1.6;color:var(--ink-3);padding:4px 0;}
  .contract-note.warn{color:#b45309;}
  .contract-note.bad{color:var(--danger);}
  .c-item{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:8px;background:#fbfcff;}
  .c-item + .c-item{margin-top:8px;}
  .c-top{display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .c-no{
    border:0;background:none;padding:0;cursor:pointer;text-align:left;font-family:inherit;
    color:var(--brand);font-size:13px;font-weight:600;line-height:1.4;text-decoration:underline;
    text-underline-offset:2px;word-break:break-all;
  }
  .c-no:hover{color:#0b3ea8;}
  .c-flag{font-size:10.5px;color:var(--ink-3);background:#f1f4f9;padding:2px 6px;border-radius:5px;flex-shrink:0;}
  .c-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:9px;}
  .c-k{display:block;font-size:11px;color:var(--ink-3);margin-bottom:2px;}
  .c-v{display:block;font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;}
  .c-v.unpaid{color:#b45309;}
  .c-v.muted{color:var(--ink-3);font-weight:500;}
  .c-rate{margin-top:9px;}
  .c-rate-top{display:flex;align-items:baseline;justify-content:space-between;font-size:11.5px;color:var(--ink-3);}
  .c-rate-top b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .ratebar{height:5px;background:#eef2f8;border-radius:4px;overflow:hidden;margin-top:5px;}
  .ratebar span{display:block;height:100%;background:var(--ok);border-radius:4px;}
  .ratebar.low span{background:var(--warn);}
  .ratebar.zero span{background:var(--danger);}

  /* ====== 合同详情 ====== */
  .c-back{
    display:inline-flex;align-items:center;gap:6px;border:1px solid #dbe4f0;background:#fff;
    color:var(--ink-2);font-family:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;cursor:pointer;
  }
  .c-back:hover{border-color:#bfd3f5;color:var(--brand);}
  .c-summary{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcff;}
  .c-summary-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .c-summary-no{font-size:14px;font-weight:700;word-break:break-all;}
  .c-summary-rate{font-size:12px;color:var(--ink-3);}
  .c-summary-rate b{font-size:18px;color:var(--ink);margin-right:2px;}
  .c-sum4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .c-cell{background:#fff;border:1px solid #e9eff8;border-radius:9px;padding:8px 10px;}
  .c-cell .k{font-size:11px;color:var(--ink-3);}
  .c-cell .v{font-size:14px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;margin-top:2px;}
  .c-cell.hot .v{color:#b45309;}
  .c-warns{margin-top:10px;padding:8px 10px;border-radius:8px;background:#fff8ec;border:1px solid #f6e0b8;}
  .c-warns div{font-size:11.5px;line-height:1.6;color:#8a5a10;}
  .c-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;border:1px solid var(--line);border-radius:10px;}
  .c-table{width:100%;min-width:470px;border-collapse:collapse;font-size:12.5px;background:#fff;}
  .c-table th,.c-table td{padding:8px 10px;border-bottom:1px solid #edf1f7;white-space:nowrap;}
  .c-table th{background:#f4f7fc;font-weight:600;color:var(--ink-2);text-align:right;}
  .c-table th:nth-child(1),.c-table th:nth-child(2){text-align:left;}
  .c-table td:nth-child(1),.c-table td:nth-child(2){text-align:left;white-space:normal;}
  .c-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .c-table tr.total td{font-weight:700;background:#f7f9fd;border-top:1px solid #dbe4f0;}
  .c-table .muted{color:var(--ink-3);}
  .c-empty{padding:18px 10px;text-align:center;color:var(--ink-3);font-size:12.5px;}
  .c-sec-title{margin:14px 0 2px;font-size:12.5px;font-weight:600;color:var(--ink-2);}

  @media (max-width:820px){
    body{overflow:hidden;}
    .topbar{height:auto;min-height:58px;padding:9px 12px;gap:8px;flex-wrap:wrap;align-items:flex-start;}
    .brand h1{font-size:15.5px;}
    .brand small{font-size:10.5px;}
    .topbar .hint{display:none;}
    .stats{
      order:3;width:100%;margin-top:2px;gap:6px;overflow-x:auto;scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
    }
    .stats::-webkit-scrollbar{display:none;}
    .stat{padding:5px 9px;font-size:11px;border-radius:8px;flex-shrink:0;}
    .stat b{font-size:13.5px;}

    .proj-tabs{padding:8px 10px;gap:7px;}
    .ptab{flex:1;justify-content:center;padding:9px 8px;font-size:13px;border-radius:9px;}
    .ptab-tip{display:none;}
    .c-grid{grid-template-columns:1fr 1fr;gap:6px 8px;}
    .c-table{min-width:430px;font-size:12px;}


    aside{
      width:100%;height:82%;max-height:82%;position:absolute;left:0;right:0;bottom:0;top:auto;
      border-left:0;border-radius:18px 18px 0 0;transform:translateY(101%);
      transition:transform .3s cubic-bezier(.4,0,.2,1);
      box-shadow:0 -12px 34px rgba(15,23,42,.22);padding-bottom:env(safe-area-inset-bottom);
      overscroll-behavior:contain;z-index:560;
    }
    aside.open{transform:translateY(0);}
    .p-head{padding:20px 14px 10px;}
    .search{padding:11px 13px;border-radius:12px;}
    .search input{font-size:15px;}
    .chip{padding:8px 14px;font-size:13px;}
    .list{padding:8px 8px 24px;}
    .row{padding:13px 12px;}
    .row-name{font-size:14px;-webkit-line-clamp:3;}
    .row-meta{font-size:12px;}

    .drawer{
      width:100%;height:90%;max-height:90%;top:auto;bottom:0;left:0;
      border-left:0;border-radius:18px 18px 0 0;transform:translateY(101%);
      padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:contain;
    }
    .drawer.open{transform:translateY(0);}
    .d-head{padding:24px 14px 12px;}
    .d-title{font-size:14.5px;}
    .back{width:34px;height:34px;border-radius:10px;}
    .d-body{padding:14px 14px 30px;}
    .kv{grid-template-columns:78px 1fr;font-size:13px;}
    .act{padding:13px 14px;font-size:14px;border-radius:12px;}
    .act svg{width:17px;height:17px;}
    .count .v b{font-size:38px;}
    .dates{gap:9px;}
    .dcell{padding:11px 12px;}
    .dcell .v{font-size:14.5px;}

    .leaflet-tooltip.proj-tip{width:min(290px,76vw);min-width:0;max-width:76vw;}

    .fab{
      display:flex;align-items:center;gap:6px;position:absolute;right:12px;bottom:calc(46px + env(safe-area-inset-bottom));
      z-index:555;padding:12px 15px;border-radius:999px;border:0;cursor:pointer;
      background:#0f172a;color:#fff;font-size:13.5px;font-weight:600;font-family:inherit;
      box-shadow:0 10px 26px rgba(15,23,42,.34);transition:opacity .2s;
    }
    .fab svg{width:16px;height:16px;fill:#fff;opacity:.9;}
    .fab .fab-n{background:rgba(255,255,255,.18);border-radius:999px;font-size:11.5px;padding:1px 7px;}
    .legend{
      display:flex;align-items:center;gap:9px;top:auto;bottom:12px;left:10px;right:auto;padding:6px 9px;
      border-radius:9px;font-size:10.5px;line-height:1.2;opacity:.96;box-shadow:0 3px 10px rgba(15,23,42,.1);
    }
    .legend .note{display:none;}
    .legend .t{display:none;}
    .legend .item{gap:4px;white-space:nowrap;font-size:10.5px;}
    .legend .s{width:8px;height:8px;border-width:1px;}

    aside:before,.drawer:before{
      content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
      width:40px;height:4px;border-radius:4px;background:#d8e2ef;z-index:3;
    }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>北京备案项目地图<span class="ro-badge">只读</span></h1>
      <small id="srcLine">正在读取云端数据…</small>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="hint" id="hintBtn" style="cursor:pointer">数据来源：云端 data.json · 点此刷新</div>
</header>

<nav class="proj-tabs" id="projTabs">
  <button class="ptab on" id="tabFiling" data-kind="filing" aria-selected="true">备案项目<span class="n" id="tabNFiling">—</span></button>
  <button class="ptab" id="tabDeal" data-kind="deal" aria-selected="false">成交项目<span class="n" id="tabNDeal">—</span></button>
  <span class="ptab-tip" id="tabTip"></span>
</nav>

<div class="stage">
  <div id="map"></div>

  <div class="map-empty" id="mapEmpty" hidden></div>

  <aside id="sidebar">
    <div class="p-head">
      <div class="search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="q" type="text" placeholder="搜索项目名称 / 地址 / 客户 / 业务员" />
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div class="drawer" id="drawer">
    <div class="d-head">
      <button class="back" id="closeBtn" title="返回列表">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 6.17 4 14l8 8 1.42-1.42L7.83 13H20z"/></svg>
      </button>
      <div class="d-title" id="dTitle"></div>
    </div>
    <div class="d-body" id="dBody"></div>
  </div>

  <div class="legend">
    <div class="t">失效紧急度</div>
    <div class="item"><span class="s" style="background:#e11d48"></span>7 天内失效</div>
    <div class="item"><span class="s" style="background:#f59e0b"></span>8–14 天</div>
    <div class="item"><span class="s" style="background:#0f9d58"></span>15 天以上</div>
    <div class="item"><span class="s" style="background:#94a3b8"></span>已失效</div>
    <div class="note">圆内数字为距离失效的天数；圆点坐标为按项目地址生成的近似位置。</div>
  </div>

  <button class="fab" id="fab">
    <svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"/></svg>
    项目列表<span class="fab-n" id="fabN">0</span>
  </button>
</div>

<script src="https://fastly.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================= 数据源 ================= */
/* 唯一数据源：同目录 ./data.json（GitHub Pages 上的公开脱敏数据）。
   只请求这一个地址：没有多数据源切换、没有 GitHub Raw / jsDelivr、
   没有飞书接口、没有本地备用 JSON、没有内置快照、没有缓存兜底。 */
const DATA_URL = './data.json';
const CONTRACT_URL = './contracts.json';   /* 受控合同数据：需后端鉴权，公开站默认无此文件 */
const FETCH_TIMEOUT = 15000;   // 云端可能较慢，给足 15 秒

let PROJECTS = [];
let DATA_META = { updated: '', source: '', count: 0 };

/* ================= 基础工具 ================= */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const DAY = 86400000;
function parseDate(s){ if(!s) return null; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? null : d; }
function daysLeft(p){ const d = parseDate(p.expire); if(!d) return null; return Math.round((d - TODAY) / DAY); }
function level(p){
  const n = daysLeft(p);
  if(n === null) return 'none';
  if(n < 0) return 'expired';
  if(n <= 7) return 'danger';
  if(n <= 14) return 'warn';
  return 'ok';
}
const COLOR = {danger:'#e11d48', warn:'#f59e0b', ok:'#0f9d58', expired:'#94a3b8', none:'#94a3b8'};
const LEVEL_TEXT = {danger:'7 天内', warn:'8–14 天', ok:'15 天以上', expired:'已失效', none:'无失效日期'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inBeijing(p){ return p.lat && p.lng && p.lat > 39.3 && p.lat < 41.2 && p.lng > 115.2 && p.lng < 117.6; }
function leftText(n){ if(n===null) return '—'; return n < 0 ? '已失效 ' + Math.abs(n) + ' 天' : n + ' 天'; }

/* 项目分类：优先读后端派生的 pkind；旧数据按“项目分类”真实值回退，绝不用名称猜。 */
const KINDS = ['filing','deal','unknown'];
function kindOf(p){
  if(p && KINDS.indexOf(p.pkind) >= 0) return p.pkind;
  const c = String((p && p.classify) || '').replace(/\u3000/g,' ').trim();
  if(c === '备案项目') return 'filing';
  if(c === '成交项目' || c === '成交') return 'deal';
  return 'unknown';
}
function kindProjects(){ return PROJECTS.filter(p => kindOf(p) === state.kind); }

/* WGS84 → GCJ-02：坐标按高德底图纠偏，避免整体偏移 */
const PI = Math.PI, AXIS = 6378245.0, ECC = 0.00669342162296594323;
function outOfChina(lat, lng){ return !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55); }
function tLat(x, y){
  let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  r += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI)) * 2/3;
  r += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30)) * 2/3;
  return r;
}
function tLng(x, y){
  let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
  r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3;
  return r;
}
function wgs2gcj(lat, lng){
  if(outOfChina(lat, lng)) return [lat, lng];
  let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
  const radLat = lat / 180 * PI;
  let magic = Math.sin(radLat); magic = 1 - ECC * magic * magic;
  const sq = Math.sqrt(magic);
  dLat = (dLat * 180) / ((AXIS * (1 - ECC)) / (magic * sq) * PI);
  dLng = (dLng * 180) / (AXIS / sq * Math.cos(radLat) * PI);
  return [lat + dLat, lng + dLng];
}
function applyGeo(list){
  list.forEach(p => {
    if(!inBeijing(p)) return;
    const g = wgs2gcj(p.lat, p.lng);
    p.glat = g[0]; p.glng = g[1];
  });
  /* 坐标相近的项目做少量错位，避免圆点叠在一起看不清 */
  const placed = [];
  list.filter(inBeijing).forEach(p => {
    p.mlat = p.glat; p.mlng = p.glng;
    for(let i = 0; i < 24; i++){
      const clash = placed.some(q => Math.abs(q.lat - p.mlat) < 0.0245 && Math.abs(q.lng - p.mlng) < 0.0275);
      if(!clash) break;
      const ang = (i * 137.5) * PI / 180;
      p.mlat = p.glat + 0.0105 * Math.sin(ang) * (1 + Math.floor(i / 4));
      p.mlng = p.glng + 0.0115 * Math.cos(ang) * (1 + Math.floor(i / 4));
    }
    placed.push({lat: p.mlat, lng: p.mlng});
  });
}

/* ================= 地图 ================= */
const map = L.map('map', {zoomControl:true, attributionControl:true, minZoom:9, maxZoom:18})
  .setView([39.94, 116.44], 11);

const street = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains: ['1','2','3','4'], maxZoom: 18, attribution: '底图 © 高德地图 · 数据：备案项目表'
}).addTo(map);

const sat = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
  subdomains: ['1','2','3','4'], maxZoom: 18, attribution: '影像 © 高德地图'
});
L.control.layers({'街道图': street, '卫星影像': sat}, null, {position:'topright'}).addTo(map);
L.control.scale({imperial:false, position:'bottomright'}).addTo(map);

/* ================= 标记 ================= */
const markers = {};
const isMobile = () => window.innerWidth <= 820;
const pinSize = () => isMobile() ? 54 : 68;

function markerIcon(p){
  const n = daysLeft(p), c = COLOR[level(p)], s = pinSize();
  return L.divIcon({
    className: 'marker-wrap',
    html: '<div class="pin" id="pin-'+p._id+'" style="background:'+c+';width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*0.37)+'px">'+(n!==null && n>=0 ? n : '×')+'</div>',
    iconSize: [s, s], iconAnchor: [s/2, s/2]
  });
}

function buildMarkers(){
  Object.keys(markers).forEach(k => { map.removeLayer(markers[k]); delete markers[k]; });
  kindProjects().filter(inBeijing).forEach(p => {
    const m = L.marker([p.mlat, p.mlng], {icon: markerIcon(p), riseOnHover:true, title:p.name}).addTo(map);
    m.bindTooltip(tipHTML(p, false), {className:'proj-tip', direction:'auto', offset:[pinSize()/2+4,0], opacity:1, sticky:false});
    m.bindPopup(tipHTML(p, true), {
      className:'proj-card', maxWidth:320, minWidth:290, offset:[0,-Math.round(pinSize()/2)],
      closeButton:false, autoPan:true, autoPanPadding:[16,16], closeOnClick:true
    });
    m.on('click', (e) => {
      if(e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent);
      m.closeTooltip();
      m.openPopup();
    });
    markers[p._id] = m;
  });
}

function tipHTML(p, withMenu){
  const n = daysLeft(p), lv = level(p);
  let html = '<div class="tip">'
    + '<h4>' + esc(p.name) + '</h4>'
    + '<div class="l"><span>位置</span><b>' + esc(p.addr || '—') + '</b></div>'
    + '<div class="l"><span>失效</span><b>' + esc(p.expire || '—') + '</b></div>'
    + '<div class="alert"><span class="t">距离失效</span>'
    + '<span class="big c-' + (lv==='ok'?'ok':lv==='warn'?'warn':lv==='danger'?'danger':'exp') + '">' + leftText(n) + '</span></div>';
  if(withMenu){
    html += '<div class="tip-menu">'
      + '<div class="tip-go" data-id="' + p._id + '">'
      + '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm2 14H8v-2h8zm0-4H8v-2h8zM13 9V3.5L18.5 9z"/></svg>'
      + '<span>查看项目明细</span><span class="arrow">›</span></div>'
      + '</div>';
  }else{
    html += '<div class="tip-tip">点击圆点可查看详情选项</div>';
  }
  return html + '</div>';
}

/* ================= 状态与列表 ================= */
const state = {q:'', filter:'all', sel:null, kind:'filing', contract:null};
const KIND_LABEL = {filing:'备案项目', deal:'成交项目', unknown:'未分类'};
const FILTERS = [
  {k:'all',   t:'全部'},
  {k:'danger',t:'7 天内'},
  {k:'warn',  t:'8–14 天'},
  {k:'ok',    t:'15 天以上'},
];

function filtered(){
  const q = state.q.trim();
  return kindProjects().filter(p => {
    if(state.filter !== 'all' && level(p) !== state.filter) return false;
    if(!q) return true;
    const hay = [p.name,p.addr,p.customer,p.owner,p.product,p.stage,p.desc,p.lastRecord].join(' ').toLowerCase();
    return hay.includes(q.toLowerCase());
  }).sort((a,b)=>{
    const A = daysLeft(a), B = daysLeft(b);
    if(A===null) return 1; if(B===null) return -1;
    return A - B;
  });
}

function renderStats(){
  const kp = kindProjects();
  const bj = kp.filter(inBeijing);
  const d7 = kp.filter(p=>{const n=daysLeft(p); return n!==null && n>=0 && n<=7;}).length;
  const d14 = kp.filter(p=>{const n=daysLeft(p); return n!==null && n>=0 && n<=14;}).length;
  const out = kp.length - bj.length;
  document.getElementById('stats').innerHTML =
    '<div class="stat"><b>'+bj.length+'</b>'+KIND_LABEL[state.kind]+'·北京</div>'
    + '<div class="stat danger"><b>'+d7+'</b>7 天内失效</div>'
    + '<div class="stat warn"><b>'+d14+'</b>14 天内失效</div>'
    + '<div class="stat"><b>'+out+'</b>异地项目</div>';
}

function district(addr){
  const m = String(addr||'').match(/(东城区|西城区|朝阳区|海淀区|丰台区|石景山区|通州区|大兴区|昌平区|顺义区|房山区|门头沟区|平谷区|怀柔区|密云区|延庆区)/);
  return m ? m[1] : '';
}

function renderChips(){
  const kp = kindProjects();
  const counts = {all:kp.length, danger:0, warn:0, ok:0};
  kp.forEach(p=>{ const lv = level(p); if(counts[lv]!==undefined) counts[lv]++; });
  document.getElementById('chips').innerHTML = FILTERS.map(f =>
    '<button class="chip'+(state.filter===f.k?' on':'')+'" data-k="'+f.k+'">'+f.t+'<span class="n">'+counts[f.k]+'</span></button>'
  ).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { state.filter = c.dataset.k; renderChips(); renderList(); });
}

function renderList(){
  const arr = filtered();
  const el = document.getElementById('list');
  if(!arr.length){
    const kp = kindProjects().length;
    el.innerHTML = '<div class="empty">'+(kp ? '没有匹配的项目' : '当前分类暂无项目')+'</div>';
    return;
  }
  el.innerHTML = arr.map((p,i) => {
    const n = daysLeft(p), lv = level(p);
    const cls = 'p-' + lv;
    return '<div class="row'+(state.sel===p._id?' on':'')+'" data-id="'+p._id+'">'
      + '<div class="row-top"><span class="idx">'+(i+1)+'</span>'
      + '<div class="row-name">'+esc(p.name)+'</div></div>'
      + '<div class="row-meta">'
      + '<span class="pill '+cls+'">'+leftText(n)+'</span>'
      + (district(p.addr) ? '<span>'+district(p.addr)+'</span>' : '')
      + '<span>失效 '+esc(p.expire||'—')+'</span>'
      + (inBeijing(p) ? '' : '<span class="tag-out">异地</span>')
      + '</div></div>';
  }).join('');
  el.querySelectorAll('.row').forEach(r => r.onclick = () => select(+r.dataset.id, true));
}

/* 分类 Tab：切换只换数据源视图，不重载页面、不重建地图实例 */
function renderTabs(){
  const f = document.getElementById('tabFiling'), d = document.getElementById('tabDeal');
  if(!f || !d) return;
  f.classList.toggle('on', state.kind === 'filing');
  d.classList.toggle('on', state.kind === 'deal');
  f.setAttribute('aria-selected', state.kind === 'filing' ? 'true' : 'false');
  d.setAttribute('aria-selected', state.kind === 'deal' ? 'true' : 'false');
  document.getElementById('tabNFiling').textContent = PROJECTS.filter(p=>kindOf(p)==='filing').length;
  document.getElementById('tabNDeal').textContent = PROJECTS.filter(p=>kindOf(p)==='deal').length;
  const unknown = PROJECTS.filter(p=>kindOf(p)==='unknown').length;
  document.getElementById('tabTip').textContent = unknown ? ('另有 ' + unknown + ' 个项目类型无法确认，未归入任何分类') : '';
}

function mapEmptyHint(){
  const el = document.getElementById('mapEmpty');
  if(!PROJECTS.length){ el.hidden = true; return; }
  const kp = kindProjects();
  if(!kp.length){
    el.hidden = false;
    el.innerHTML = KIND_LABEL[state.kind] + '当前没有项目<br><span style="font-size:11.5px;color:var(--ink-3)">可切换上方导航查看另一类项目</span>';
  }else if(!kp.filter(inBeijing).length){
    el.hidden = false;
    el.textContent = KIND_LABEL[state.kind] + '暂无北京范围项目（共 ' + kp.length + ' 个异地项目，可在列表中查看）';
  }else{
    el.hidden = true;
  }
}

function setKind(kind){
  if(kind === state.kind || (kind !== 'filing' && kind !== 'deal')) return;
  state.kind = kind;
  state.sel = null;
  state.contract = null;
  Object.keys(markers).forEach(k => { markers[k].closePopup(); markers[k].closeTooltip(); });
  document.getElementById('drawer').classList.remove('open');
  document.querySelectorAll('.pin').forEach(x => x.classList.remove('sel'));
  buildMarkers();
  renderTabs(); renderStats(); renderChips(); renderList(); mapEmptyHint();
  document.getElementById('fabN').textContent = kindProjects().length;
}
document.getElementById('projTabs').addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('.ptab') : null;
  if(!b) return;
  setKind(b.dataset.kind);
});

/* ================= 详情 ================= */
function kv(rows){
  return '<div class="kv">' + rows.filter(r=>r[1]).map(r => '<div class="k">'+r[0]+'</div><div class="v">'+esc(r[1])+'</div>').join('') + '</div>';
}

function amapUrl(p){
  const bj = inBeijing(p);
  const lat = bj ? p.glat : p.lat, lng = bj ? p.glng : p.lng;
  const coord = bj ? 'gaode' : 'wgs84';
  const name = (p.name || '').slice(0, 40) + ' · 备案项目';
  return 'https://uri.amap.com/marker?position=' + lng + ',' + lat
    + '&name=' + encodeURIComponent(name)
    + '&src=' + encodeURIComponent('备案项目地图')
    + '&coordinate=' + coord + '&callnative=1';
}

function renderDetail(p){
  const n = daysLeft(p), lv = level(p);
  const color = COLOR[lv];
  const total = (()=>{ const a = parseDate(p.filing), b = parseDate(p.expire); if(!a||!b) return null; return Math.max(1, Math.round((b-a)/DAY)); })();
  const used = (()=>{ const a = parseDate(p.filing); if(!a) return null; return Math.round((TODAY-a)/DAY); })();
  const pct = (total && used!==null) ? Math.min(100, Math.max(0, used/total*100)) : 100;

  document.getElementById('dTitle').textContent = p.name;

  let html = '';
  html += '<div class="count">'
    + '<div class="k">距离失效 · 剩余天数</div>'
    + '<div class="v"><b style="color:'+color+'">'+(n===null?'—':(n<0? Math.abs(n) : n))+'</b>'
    + '<i>'+(n===null?'':(n<0?'天 前已失效':'天')+'　'+LEVEL_TEXT[lv])+'</i></div>'
    + '<div class="bar"><span style="width:'+pct+'%;background:'+color+'"></span></div>'
    + '<div class="tk"><span>备案 '+esc(p.filing||'—')+'</span><span>失效 '+esc(p.expire||'—')+'</span></div>'
    + '</div>';

  html += '<div class="acts">'
    + '<a class="act amap" href="'+amapUrl(p)+'" target="_blank" rel="noopener">'
    + '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z"/></svg>'
    + '在高德地图中打开 / 导航</a>'
    + '<div class="act-note">手机端会唤起高德地图 App，电脑端打开高德网页版</div>'
    + '</div>';

  html += '<div class="sec"><h5>项目日期</h5><div class="dates">'
    + '<div class="dcell"><div class="k">备案时间</div><div class="v">'+esc(p.filing||'—')+'</div></div>'
    + '<div class="dcell hot"><div class="k">失效时间</div><div class="v">'+esc(p.expire||'—')+'</div></div>'
    + '<div class="dcell"><div class="k">最后一次签到</div><div class="v">'+esc(p.lastSign||'—')+'</div></div>'
    + '<div class="dcell"><div class="k">签到次数</div><div class="v">'+(p.signCount||0)+' 次</div></div>'
    + '</div></div>';

  html += '<div class="sec"><h5>项目信息</h5>' + kv([
    ['项目地址', p.addr],
    ['业务员', p.owner + (p.dept ? ' · ' + p.dept : '')],
    ['客户信息', p.customer],
    ['客户性质', [p.customerType, p.customerQual, p.contact].filter(Boolean).join(' · ')],
    ['产品类型', p.product],
    ['项目类型', [p.classify, p.ptype, p.build].filter(Boolean).join(' · ')],
    ['项目进度', p.stage],
    ['预计金额', p.amount],
    ['折扣信息', p.discount],
    ['项目来源', p.source],
    ['是否报价', p.quoted],
    ['智能疏散', p.evac],
    ['情况描述', p.desc],
    ['客户地址', p.customerAddr]
  ]) + '</div>';

  /* 合同信息：紧接「项目来源」所在的项目信息之后 */
  html += '<div class="sec" id="contractSec"><h5>合同信息</h5>'
    + '<div id="contractBox"><div class="contract-loading">正在读取合同信息…</div></div></div>';

  html += '<div class="sec"><h5>跟进记录</h5>';
  if(p.signs && p.signs.length){
    html += '<div class="timeline">' + p.signs.slice(0, 40).map(s =>
      '<div class="tl"><div class="d">'+esc(s.date)+'</div><div class="t">'+esc(s.note || '—')+'</div></div>'
    ).join('') + '</div>';
  } else {
    html += '<div class="empty">暂无签到记录</div>';
  }
  html += '</div>';

  if(p.fields && p.fields.length){
    html += '<div class="sec"><h5>全部字段 · 只读</h5>'
      + '<details class="all"><summary>展开 <b>'+p.fields.length+'</b> 项公开字段</summary>'
      + '<div class="kv">' + p.fields.map(f =>
          '<div class="k">'+esc(f[0])+'</div><div class="v">'+esc(f[1])+'</div>'
        ).join('') + '</div></details></div>';
  }

  document.getElementById('dBody').innerHTML = html;
  document.getElementById('dBody').scrollTop = 0;
  hydrateContracts(p);
}

/* ================= 交互 ================= */
function select(id, pan){
  state.sel = id;
  state.contract = null;
  const p = PROJECTS[id];
  renderDetail(p);
  if(markers[id]) markers[id].closePopup();
  document.getElementById('drawer').classList.add('open');
  if(isMobile()){
    document.getElementById('sidebar').classList.remove('open');
    const f = document.getElementById('fab');
    f.style.opacity = '0'; f.style.pointerEvents = 'none';
  }
  document.querySelectorAll('.pin').forEach(x => x.classList.remove('sel'));
  const pin = document.getElementById('pin-'+id);
  if(pin) pin.classList.add('sel');
  renderList();
  if(pan && markers[id]){
    const z = isMobile() ? Math.max(map.getZoom(), 13) : Math.max(map.getZoom(), 13);
    map.flyTo([p.mlat, p.mlng], z, {duration:0.6});
    markers[id].openTooltip();
    setTimeout(()=>markers[id].closeTooltip(), 3500);
  }
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  state.sel = null;
  state.contract = null;
  CONTRACTS.current = [];
  document.querySelectorAll('.pin').forEach(x => x.classList.remove('sel'));
  renderList();
  if(isMobile()){
    const f = document.getElementById('fab');
    f.style.opacity = '1'; f.style.pointerEvents = 'auto';
  }
}
document.getElementById('closeBtn').onclick = closeDrawer;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });

/* ================= 合同信息（受控数据） ================= */
/* 合同金额、回款、产品与发货属于敏感财务数据，只允许来自受控接口。
   公开站若未部署 ./contracts.json 则明确提示“未接入”，绝不用前端假数据填充。 */
const CONTRACTS = {loaded:false, status:'idle', data:null, error:'', current:[]};

function moneyText(v){
  if(v === null || v === undefined || v === '') return '暂无数据';
  return '¥' + v;
}
function rateText(v){
  if(v === null || v === undefined || v === '') return '暂无数据';
  return v + '%';
}
function rateBar(rate){
  const n = parseFloat(rate);
  const w = isNaN(n) ? 0 : Math.min(100, Math.max(0, n));
  const cls = w <= 0 ? ' zero' : (w < 60 ? ' low' : '');
  return '<div class="ratebar'+cls+'"><span style="width:'+w+'%"></span></div>';
}

async function fetchContracts(force){
  if(CONTRACTS.loaded && !force) return CONTRACTS;
  CONTRACTS.loaded = true; CONTRACTS.status = 'loading'; CONTRACTS.error = '';
  try{
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), FETCH_TIMEOUT);
    let r;
    try{
      r = await fetch(CONTRACT_URL, {cache:'no-store', signal: ctl.signal});
    }finally{
      clearTimeout(timer);
    }
    if(r.status === 401 || r.status === 403){ CONTRACTS.status = 'no_permission'; return CONTRACTS; }
    if(r.status === 404){ CONTRACTS.status = 'not_configured'; return CONTRACTS; }
    if(!r.ok){ CONTRACTS.status = 'error'; CONTRACTS.error = 'HTTP ' + r.status; return CONTRACTS; }
    let j;
    try{ j = await r.json(); }catch(_){ CONTRACTS.status = 'error'; CONTRACTS.error = '合同数据不是合法 JSON'; return CONTRACTS; }
    if(!j || typeof j !== 'object' || !j.projects){
      CONTRACTS.status = 'error'; CONTRACTS.error = '合同数据结构不正确'; return CONTRACTS;
    }
    CONTRACTS.data = j;
    CONTRACTS.status = 'ok';
  }catch(e){
    CONTRACTS.status = 'error';
    CONTRACTS.error = msg(e);
  }
  return CONTRACTS;
}

function contractNote(text, cls){
  return '<div class="contract-note'+(cls ? ' '+cls : '')+'">'+esc(text)+'</div>';
}

function contractItemHTML(c, idx){
  const rate = c.collectionRate;
  return '<div class="c-item">'
    + '<div class="c-top">'
    + '<button type="button" class="c-no" data-ci="'+idx+'" title="查看合同详情">'+esc(c.contractNo || '未编号合同')+'</button>'
    + '<span class="c-flag">'+esc(c.contractStatus || '合同')+'</span>'
    + '</div>'
    + '<div class="c-grid">'
    + '<div><span class="c-k">合同金额</span><span class="c-v">'+esc(moneyText(c.contractAmount))+'</span></div>'
    + '<div><span class="c-k">未回金额</span><span class="c-v'+((c.unreceivedAmount && parseFloat(String(c.unreceivedAmount).replace(/,/g,''))>0) ? ' unpaid' : '')+'">'+esc(moneyText(c.unreceivedAmount))+'</span></div>'
    + '</div>'
    + '<div class="c-rate">'
    + '<div class="c-rate-top"><span>回款率</span><b>'+esc(rateText(rate))+'</b></div>'
    + (rate ? rateBar(rate) : '')
    + '</div>'
    + ((c.contractStatus && c.contractStatus !== '已通过')
        ? contractNote('合同状态为「'+c.contractStatus+'」，回款尚未生效')
        : (c.isSubContract ? contractNote('补充协议/修订合同，回款并入主合同') : ''))
    + '</div>';
}

function contractsHTML(st, p){
  if(st.status === 'not_configured') return contractNote('合同财务数据尚未接入受控接口，当前仅能查看项目公开信息。', 'warn');
  if(st.status === 'no_permission') return contractNote('无权限查看合同与回款信息，请联系业务管理员开通。', 'bad');
  if(st.status === 'error') return contractNote('合同接口异常：' + (st.error || '未知错误'), 'bad')
    + '<div class="contract-note"><button type="button" class="c-back" id="cRetry">重新加载合同信息</button></div>';
  if(st.status !== 'ok') return contractNote('正在读取合同信息…');

  const bucket = st.data.projects || {};
  const entry = bucket[p.name] || null;
  CONTRACTS.current = [];
  if(!entry) return contractNote('暂无关联合同');
  if(entry.status === 'no_contract' || !(entry.contracts || []).length) return contractNote('暂无关联合同');
  CONTRACTS.current = entry.contracts;
  let html = '';
  if(entry.status === 'no_finance_record' || entry.status === 'source_not_configured'){
    html += contractNote('已关联合同编号，但合同金额与回款数据尚未由财务系统提供。', 'warn');
  }
  html += entry.contracts.map((c, i) => contractItemHTML(c, i)).join('');
  return html;
}

async function hydrateContracts(p){
  const st = await fetchContracts();
  if(state.sel !== p._id || state.contract) return;
  const box = document.getElementById('contractBox');
  if(!box) return;
  box.innerHTML = contractsHTML(st, p);
}

function renderContractDetail(p, c){
  document.getElementById('dTitle').textContent = '合同详情 · ' + (c.contractNo || '未编号合同');
  const anomalies = (c.anomalies || []).map(a => a && a.message).filter(Boolean);
  if(c.contractStatus && c.contractStatus !== '已通过'){
    anomalies.unshift('合同状态为「'+c.contractStatus+'」，回款尚未生效');
  }else if(c.isSubContract){
    anomalies.unshift('补充协议/修订合同，金额为本行金额，产品与回款按主合同汇总');
  }
  let html = '';
  html += '<button type="button" class="c-back" id="cBack">‹ 返回项目详情</button>';

  html += '<div class="c-summary">'
    + '<div class="c-summary-top">'
    + '<div class="c-summary-no">'+esc(c.contractNo || '未编号合同')+' <span class="c-flag">'+esc(c.contractStatus || '合同')+'</span></div>'
    + '<div class="c-summary-rate">回款率<b>'+esc(rateText(c.collectionRate))+'</b></div>'
    + '</div>'
    + (c.collectionRate ? rateBar(c.collectionRate) : '')
    + '<div class="c-sum4">'
    + '<div class="c-cell"><div class="k">合同金额</div><div class="v">'+esc(moneyText(c.contractAmount))+'</div></div>'
    + '<div class="c-cell"><div class="k">已回款金额</div><div class="v">'+esc(moneyText(c.receivedAmount))+'</div></div>'
    + '<div class="c-cell hot"><div class="k">未回金额</div><div class="v">'+esc(moneyText(c.unreceivedAmount))+'</div></div>'
    + '<div class="c-cell"><div class="k">产品数量</div><div class="v">'+(c.products||[]).length+' 项</div></div>'
    + '</div></div>';

  if(anomalies.length){
    html += '<div class="c-warns">' + anomalies.slice(0, 6).map(m => '<div>⚠ '+esc(m)+'</div>').join('') + '</div>';
  }

  html += '<div class="c-sec-title">合同产品明细</div>';
  if(c.products && c.products.length){
    html += '<div class="c-table-wrap"><table class="c-table">'
      + '<thead><tr><th>序号</th><th>产品名称</th><th>合同金额</th><th>发货金额</th></tr></thead><tbody>'
      + c.products.map(r =>
          '<tr><td>'+(r.seq||'')+'</td><td>'+esc(r.name||'—')+'</td>'
          + '<td class="num'+(!r.contractAmount?' muted':'')+'">'+esc(r.contractAmount ? '¥'+r.contractAmount : '暂无数据')+'</td>'
          + '<td class="num'+(!r.shippedAmount?' muted':'')+'">'+esc(r.shippedAmount ? '¥'+r.shippedAmount : '暂无数据')+'</td></tr>'
        ).join('')
      + '<tr class="total"><td colspan="2">合计</td>'
      + '<td class="num">'+esc(c.totalContractAmount ? '¥'+c.totalContractAmount : '暂无数据')+'</td>'
      + '<td class="num">'+esc(c.totalShippedAmount ? '¥'+c.totalShippedAmount : '暂无数据')+'</td></tr>'
      + '</tbody></table></div>';
    if(c.productsIncomplete){
      html += '<div class="contract-note">部分产品金额缺失，合计仅统计已有金额的产品。</div>';
    }
  }else{
    html += '<div class="c-empty">暂无产品明细</div>';
  }

  document.getElementById('dBody').innerHTML = html;
  document.getElementById('dBody').scrollTop = 0;
}

function openContract(idx){
  const c = CONTRACTS.current[idx];
  const p = PROJECTS[state.sel];
  if(!c || !p) return;
  state.contract = {projectId: p._id, contractNo: c.contractNo};
  renderContractDetail(p, c);
}

function backToProject(){
  const p = PROJECTS[state.sel];
  if(!p){ closeDrawer(); return; }
  state.contract = null;
  renderDetail(p);
}

document.getElementById('dBody').addEventListener('click', e => {
  const t = e.target;
  const no = t.closest ? t.closest('.c-no') : null;
  if(no){ e.preventDefault(); openContract(+no.dataset.ci); return; }
  const back = t.closest ? t.closest('#cBack') : null;
  if(back){ e.preventDefault(); backToProject(); return; }
  const retry = t.closest ? t.closest('#cRetry') : null;
  if(retry){
    e.preventDefault();
    const box = document.getElementById('contractBox');
    if(box) box.innerHTML = '<div class="contract-loading">正在重新加载合同信息…</div>';
    CONTRACTS.loaded = false;
    const p = PROJECTS[state.sel];
    if(p) hydrateContracts(p);
  }
});

/* ================= 数据加载 ================= */
function setStatus(txt, bad){
  const el = document.getElementById('srcLine');
  if(!el) return;
  el.textContent = txt;
  el.style.color = bad ? '#fda4af' : '';
}

async function getJSON(url, ms){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || FETCH_TIMEOUT);
  try{
    const r = await fetch(url, {cache:'no-store', signal: ctl.signal});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  }finally{
    clearTimeout(timer);
  }
}

function msg(e){
  if(!e) return '未知错误';
  if(e.name === 'AbortError') return '超时';
  return e.message || String(e);
}

function normalize(payload){
  const arr = Array.isArray(payload) ? payload : (payload.projects || []);
  return arr.map((p, i) => {
    p._id = i;
    p.signCount = Number(p.signCount || (p.signs || []).length || 0);
    if(p.lat === '' || p.lat === null || p.lat === undefined){ p.lat = null; p.lng = null; }
    if(p.lat !== null){ p.lat = Number(p.lat); p.lng = Number(p.lng); }
    if(!p.signs) p.signs = [];
    return p;
  });
}

/* 校验 data.json：必须是对象，projects 必须是非空数组，且每条都要有名称 */
function checkPayload(j){
  if(!j || typeof j !== 'object' || Array.isArray(j)) throw new Error('数据格式不正确');
  if(j.error) throw new Error(String(j.error));
  const arr = j.projects;
  if(!Array.isArray(arr)) throw new Error('缺少 projects 数组');
  if(!arr.length) throw new Error('数据为空');
  if(!arr.every(p => p && typeof p === 'object' && String(p.name || '').trim())) {
    throw new Error('项目数据不完整');
  }
  return arr;
}

/* 唯一加载流程：请求同目录 ./data.json → 校验 → 交给渲染 */
async function loadData(){
  const payload = await getJSON(DATA_URL);
  const arr = checkPayload(payload);
  return { payload, arr };
}

async function bootstrap(){
  const fabN = document.getElementById('fabN');
  setStatus('正在读取云端数据…');
  fabN.textContent = '—';          // 加载中不显示 0 条，避免被当成真实数量
  try{
    const { payload, arr } = await loadData();
    PROJECTS = normalize(arr);
    DATA_META = {
      updated: payload.updated || '',
      source: payload.source || '',
      count: PROJECTS.length
    };
    applyGeo(PROJECTS);
    buildMarkers();
    renderTabs(); renderStats(); renderChips(); renderList(); mapEmptyHint();
    document.getElementById('fabN').textContent = kindProjects().length;
    document.title = '北京备案项目地图' + (DATA_META.updated ? ' · ' + DATA_META.updated.slice(0, 10) : '');
    setStatus('云端数据 ' + (DATA_META.updated ? DATA_META.updated.slice(5, 16) : '') + ' · 共 ' + PROJECTS.length + ' 条');
  }catch(e){
    PROJECTS = [];
    DATA_META = { updated: '', source: '', count: 0 };
    document.getElementById('stats').innerHTML = '';
    document.getElementById('chips').innerHTML = '';
    document.getElementById('list').innerHTML = '';
    document.getElementById('tabNFiling').textContent = '—';
    document.getElementById('tabNDeal').textContent = '—';
    document.getElementById('tabTip').textContent = '';
    document.getElementById('mapEmpty').hidden = true;
    document.getElementById('fab').style.display = 'none';
    fabN.textContent = '';
    document.title = '北京备案项目地图';
    setStatus('云端数据加载失败，请稍后刷新页面。', true);
  }
  if(!isMobile() && PROJECTS.length){
    const f = document.getElementById('fab');
    f.style.opacity = '0'; f.style.pointerEvents = 'none';
  }
  const autoOpen = new URLSearchParams(location.search).get('open');
  if(autoOpen !== null && PROJECTS.length){
    const id = Number(autoOpen);
    const p = PROJECTS[id];
    if(p){
      const k = kindOf(p);
      if(k === 'deal' || k === 'filing'){
        state.kind = k;
        buildMarkers();
        renderTabs(); renderStats(); renderChips(); renderList(); mapEmptyHint();
        document.getElementById('fabN').textContent = kindProjects().length;
      }
      select(id, true);
    }
  }
  setTimeout(()=>map.invalidateSize(), 200);
}

document.getElementById('hintBtn').onclick = () => location.reload();
bootstrap();
