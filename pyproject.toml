[project]
name = "jbufa-beian-map"
version = "2.1.0"
description = "青鸾备案项目每日导出 + 只读地图（云端定时抓取、脱敏发布）"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pynacl>=1.5,<2", "pytest>=7.4"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
