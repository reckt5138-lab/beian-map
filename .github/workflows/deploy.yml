name: 代码检查（不发布）

# PR / 手动触发：只跑测试与安全检查，绝不发布生产站点。
# 生产发布只在 daily.yml 里、且只允许 main 分支。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  TZ: Asia/Shanghai

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: 语法编译检查
        run: python -m compileall -q app scripts tests

      - name: 自动化测试（不需要真实账号）
        run: python -m unittest discover -s tests -v

      - name: 敏感文件检查
        run: |
          python - <<'PY'
          import subprocess, sys
          bad = []
          for name in ("config/credentials.json", "config/deploy.json",
                       "output/data.full.json", ".env"):
              r = subprocess.run(["git", "ls-files", name], capture_output=True, text=True)
              if r.stdout.strip():
                  bad.append(name)
          if bad:
              print("发现不应提交的敏感文件：", bad)
              raise SystemExit(1)
          print("敏感文件检查通过")
          PY

      - name: 数据结构检查（离线样本）
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from app.security import sanitize, assert_safe
          data = json.load(open("data.json", encoding="utf-8"))
          public = sanitize(data)
          ok, problems = assert_safe(public)
          print("脱敏自检：", "通过" if ok else problems)
          raise SystemExit(0 if ok else 1)
          PY
