name: 备案项目每日更新

# 云端定时：抓数 → 校验 → 脱敏 → 构建网页 → 免费发布（GitHub Pages + 可选 Cloudflare Pages）
# 安全底线：完整 158 列数据只存在 runner 临时目录，永远不提交、不上传 artifact；
# 仓库与网页只拿到 app/security/sanitize.py 的白名单字段。

on:
  schedule:
    - cron: "10 18 * * *"   # UTC 18:10 = 北京时间 02:10
  workflow_dispatch:

concurrency:
  group: daily-map
  cancel-in-progress: false

permissions:
  contents: write     # 提交脱敏后的 data.json / index.html
  pages: write        # GitHub Pages 发布
  id-token: write     # deploy-pages 需要

env:
  TZ: Asia/Shanghai
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: 抓数（不写飞书，完整数据只留在本机临时目录）
        env:
          JUFA_USERNAME: ${{ secrets.JUFA_USERNAME }}
          JUFA_PASSWORD: ${{ secrets.JUFA_PASSWORD }}
        run: python app/crawler.py --no-feishu --json-out output/data.full.json

      - name: 数据校验 + 脱敏 + 构建网页（不通过就整步失败，不发布）
        run: python -m app.main publish --source output/data.full.json

      - name: 发布前安全检查（白名单自检 + 无凭证）
        run: |
          python - <<'PY'
          import json, re, sys
          sys.path.insert(0, ".")
          from app.security import assert_safe
          data = json.load(open("data.json", encoding="utf-8"))
          ok, problems = assert_safe(data)
          if not ok:
              print("发布数据未通过白名单自检：")
              [print("  -", p) for p in problems]
              raise SystemExit(1)
          html = open("index.html", encoding="utf-8").read()
          for pat in (r"ghp_[A-Za-z0-9]{20,}", r"cli_[a-z0-9]{10,}", r'"password"\s*:\s*"[^"]{3,}"'):
              if re.search(pat, html):
                  print("网页疑似包含凭证", pat)
                  raise SystemExit(1)
          print("安全检查通过：%d 条 / %d 列（脱敏）" % (data["count"], data["columns"]))
          PY

      - name: 提交脱敏数据与页面（走 API，没变化就不提交）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python app/publish_commit.py

      - name: 刷新 jsDelivr 缓存（可选，失败不影响）
        continue-on-error: true
        run: |
          REPO="${{ github.repository }}"
          for u in "https://purge.jsdelivr.net/gh/${REPO}@main/data.json" \
                   "https://purge.jsdelivr.net/gh/${REPO}@main/index.html" ; do
            curl -fsS --max-time 20 "$u" > /dev/null && echo "purge ok" || echo "purge skip"
          done

      - name: 整理发布目录（只放脱敏数据与网页）
        run: |
          ls -lh dist
          test -s dist/index.html
          test -s dist/data.json

      # 主站：GitHub Pages（零额外账号，免费）
      - name: 准备 Pages 站点
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: 打包 Pages 站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 备用站：Cloudflare Pages（配了三个 Secret 才发布，国内访问更稳）
      - name: 发布到 Cloudflare Pages（备用站）
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: env.CF_TOKEN != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main

      # 失败留档：只保留脱敏数据与网页，绝不发布完整业务数据 / Excel
      - name: 保留本次产物（脱敏）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 备案项目-脱敏-${{ github.run_id }}
          path: |
            data.json
            index.html
          retention-days: 14

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
