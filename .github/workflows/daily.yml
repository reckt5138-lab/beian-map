name: 备案项目每日更新

# 云端定时跑：抓青鸾数据 → 直接生成 data.json + 网页 → 免费发布，电脑关机也照跑。
# 不再写飞书在线表格，数据只走「爬虫 → data.json → 网页」这条线。

on:
  schedule:
    - cron: "10 18 * * *"   # UTC 18:10 = 北京时间 02:10
  workflow_dispatch:

concurrency:
  group: daily-map
  cancel-in-progress: false

permissions:
  contents: write     # 要把 data.json 提交回仓库，必须写权限
  pages: write        # GitHub Pages 发布（免费，零额外账号）
  id-token: write     # deploy-pages 需要

env:
  TZ: Asia/Shanghai
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r app/requirements.txt

      - name: 抓数（不写飞书，直接出 Excel + data.json）
        env:
          JUFA_USERNAME: ${{ secrets.JUFA_USERNAME }}
          JUFA_PASSWORD: ${{ secrets.JUFA_PASSWORD }}
        run: python app/crawler.py --no-feishu --json-out data.json

      - name: 生成网页（内置快照 + 云端地址）
        # GITHUB_REPOSITORY 由 Actions 提供（owner/repo），构建脚本自动取用
        run: python app/build_map_html.py --from-json data.json --out index.html

      - name: 校验产物
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data.json", encoding="utf-8"))
          assert d.get("count"), "data.json 里 0 条，停止发布"
          assert d.get("projects"), "data.json 缺 projects"
          assert d.get("rows"), "data.json 缺 rows"
          print("data.json OK：%d 条 / %d 列 / %s" % (d["count"], d["columns"], d["updated"]))
          PY
          test -s index.html || (echo "index.html 没生成" && exit 1)

      - name: 提交数据与页面回仓库（走 API，没变化就不提交）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python app/publish_commit.py

      - name: 刷新 jsDelivr 缓存（可选，失败不影响）
        continue-on-error: true
        run: |
          REPO="${{ github.repository }}"
          for u in "https://purge.jsdelivr.net/gh/${REPO}@main/data.json" \
                   "https://purge.jsdelivr.net/gh/${REPO}@main/index.html" ; do
            echo "purge: $u"
            curl -fsS --max-time 20 "$u" > /dev/null && echo "  ok" || echo "  (忽略失败)"
          done

      - name: 整理发布目录（只发网页和数据，不发代码和密钥）
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp data.json  dist/data.json
          ls -lh dist

      # 免费公开访问：Cloudflare Pages（私有仓库也能用，链接固定）
      # 需要 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID、CLOUDFLARE_PROJECT_NAME
      - name: 发布到 Cloudflare Pages
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: 保留本次产物（网页 / JSON / Excel 都能下载）
        uses: actions/upload-artifact@v4
        with:
          name: 备案项目-${{ github.run_id }}
          path: |
            data.json
            index.html
            output/*.xlsx
          retention-days: 30

      # 免费公开访问（零额外账号）：GitHub Pages
      # 首次需要仓库 Settings → Pages → Source 选 "GitHub Actions"（部署脚本已自动设置）
      - name: 准备 Pages 站点
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: 打包 Pages 站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
